  <script>
    const palette = [
      "#1a1c2c",
      "#5d275d",
      "#b13e53",
      "#ef7d57",
      "#ffcd75",
      "#a7f070",
      "#38b764",
      "#257179",
      "#29366f",
      "#3b5dc9",
      "#41a6f6",
      "#73eff7",
      "#f4f4f4",
      "#94b0c2",
      "#566c86",
      "#333c57",
    ];

    const rainbowColors = [
      palette[2],  // #b13e53 - Crimson Red
      palette[3],  // #ef7d57 - Coral Orange
      palette[4],  // #ffcd75 - Warm Yellow
      palette[5],  // #a7f070 - Lime Green
      palette[6],  // #38b764 - Medium Green
      palette[10], // #41a6f6 - Bright Blue
      palette[1],  // #5d275d - Deep Purple
      palette[2]   // #b13e53 - Loop start color
    ];

    const heading = document.querySelector('.rainbow-text');
    heading.style.background = `linear-gradient(90deg, ${rainbowColors.join(', ')})`;
    heading.style.backgroundSize = '200% auto';
    heading.style.webkitBackgroundClip = 'text';
    heading.style.webkitTextFillColor = 'transparent';
    heading.style.backgroundClip = 'text';
  </script>
